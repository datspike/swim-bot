name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /opt/swim-bot
  APP_NAME: swim-bot
  SERVICE_NAME: swim-bot.service

jobs:
  deploy:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build linux amd64 binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/swim-bot ./cmd/swim-bot
          sha256sum dist/swim-bot

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload binary to remote home
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          scp -P "$PROD_PORT" dist/swim-bot "$PROD_USER@$PROD_HOST:~/swim-bot"

      - name: Install and restart service
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "APP_DIR='$APP_DIR' APP_NAME='$APP_NAME' SERVICE_NAME='$SERVICE_NAME' bash -se" <<'EOF'
          set -euo pipefail
          stamp=$(date +%Y%m%d-%H%M%S)
          cp "$APP_DIR/$APP_NAME" "$APP_DIR/backups/$APP_NAME-$stamp"
          install -m 0755 ~/swim-bot "$APP_DIR/$APP_NAME"
          rm -f ~/swim-bot
          sudo systemctl restart "$SERVICE_NAME"
          EOF

      - name: Verify deployment
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "SERVICE_NAME='$SERVICE_NAME' bash -se" <<'EOF'
          set -euo pipefail
          systemctl is-active --quiet "$SERVICE_NAME"
          systemctl status "$SERVICE_NAME" --no-pager --lines=20
          echo
          echo '--- Recent logs ---'
          journalctl -u "$SERVICE_NAME" -n 40 --no-pager || true
          EOF
