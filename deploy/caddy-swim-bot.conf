# Caddy конфигурация для swim-bot webhook
# Добавить в блок datspike.xyz:8443 в /etc/caddy/Caddyfile
#
# Полный Caddyfile: ~/hobby/vps_docs/configs/caddy/Caddyfile
# Управление: sudo systemctl reload caddy
#
# Цепочка: Telegram -> Xray Reality (:443) -> Caddy (:8443) -> swim-bot (:8080)

# swim-bot webhook (Telegram anti-spam бот)
handle /swim-bot/* {
    reverse_proxy localhost:8080
}
